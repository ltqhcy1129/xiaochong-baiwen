services:
  - type: web
    name: xiaochong-baiwen
    runtime: docker
    plan: free
    region: singapore          # 离国内最近，冷启动后延迟最低
    dockerContext: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: LLM_PROVIDER
        value: deepseek
      - key: LLM_BASE_URL
        value: https://api.deepseek.com/v1
      - key: LLM_MODEL
        value: deepseek-chat
      # 密钥不写进仓库，在 Render 面板里填一次（勾选 Secret）
      - key: LLM_API_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: XC_SUPPORT
        sync: false
      - key: XC_SUPPORT_HOURS
        sync: false
      - key: XC_ADMIN_PASSWORD
        sync: false
